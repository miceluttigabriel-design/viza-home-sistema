name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Typecheck + Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generar Prisma Client
        run: bunx prisma generate
        env:
          # Valor ficticio: `generate` no se conecta a la base.
          DATABASE_URL: postgresql://user:pass@localhost:5432/ci

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint
